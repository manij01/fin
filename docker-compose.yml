services:
  finally:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - finally-data:/app/db
    environment:
      DB_PATH: /app/db/finally.db
      LLM_MOCK: ${LLM_MOCK:-false}
      MASSIVE_API_KEY: ${MASSIVE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

volumes:
  finally-data:
